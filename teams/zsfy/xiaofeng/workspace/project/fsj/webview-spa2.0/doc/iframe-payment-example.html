<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品购买</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'PingFang SC', sans-serif;
      background: #f5f5f5;
      padding: 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .user-info { font-size: 14px; color: #666; }
    .user-info strong { color: #333; }
    .balance-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }
    .balance-label { font-size: 14px; color: #999; }
    .balance-value { font-size: 24px; color: #f97316; font-weight: 700; }
    .balance-value::after { content: ' 元'; font-size: 14px; color: #999; font-weight: 400; }
    .product-card {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .product-img {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .product-info { flex: 1; }
    .product-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .product-price { font-size: 20px; color: #ef4444; font-weight: 700; }
    .product-price::after { content: ' 元'; font-size: 12px; color: #999; font-weight: 400; }
    .deduct-row {
      font-size: 12px;
      color: #10b981;
      margin-top: 4px;
    }
    .buy-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #f97316, #ef4444);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }
    .buy-btn:active { opacity: 0.85; }
    .buy-btn:disabled { background: #ccc; cursor: not-allowed; }
    .status {
      text-align: center;
      font-size: 13px;
      color: #999;
      margin-top: 8px;
    }
    .status.error { color: #ef4444; }
    .status.success { color: #10b981; }
  </style>
</head>
<body>

  <!-- 用户信息 -->
  <div class="card">
    <div class="user-info">
      你好，<strong id="user-name">--</strong>
    </div>
    <div class="balance-row">
      <span class="balance-label">我的余额</span>
      <span class="balance-value" id="balance-display">--</span>
    </div>
  </div>

  <!-- 商品 -->
  <div class="card">
    <div class="product-card">
      <div class="product-img">🎁</div>
      <div class="product-info">
        <div class="product-name">测试商品</div>
        <div class="product-price" id="product-price">0.01</div>
        <div class="deduct-row" id="deduct-info"></div>
      </div>
    </div>
    <button class="buy-btn" id="buy-btn" disabled>加载中...</button>
    <div class="status" id="status-msg"></div>
  </div>

  <script>
    (function () {
      var openid = '';
      var userId = '';
      var userName = '';
      var shangjiaRowid = '';
      var userBalance = 0;
      var productPrice = 0.01;

      // 接收主页面传递的用户身份（postMessage 方式，优先级高于 hash）
      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'fsj:userData') {
          var data = e.data.data;
          openid = data.openid || '';
          userId = data.userId || '';
          userName = data.userName || '';
          shangjiaRowid = data.shangjiaRowid || '';
          document.getElementById('user-name').textContent = userName || '用户';
          if (openid) {
            fetchBalance();
          }
        }
      });

      // 从 hash 读取用户身份（回退方案）
      (function parseHash() {
        var hash = window.location.hash;
        if (!hash) return;
        try {
          var hashStr = hash.startsWith('#') ? hash.slice(1) : hash;
          var params = new URLSearchParams(hashStr);
          openid = params.get('fsj_openid') || '';
          userName = decodeURIComponent(params.get('fsj_user') || '');
          shangjiaRowid = params.get('fsj_shangjia') || '';
          if (document.getElementById('user-name') && userName) {
            document.getElementById('user-name').textContent = userName;
          }
          if (openid) {
            fetchBalance();
          }
        } catch (e) {
          showStatus('Hash 解析失败: ' + e.message, 'error');
        }
      })();

      // 查询余额（后端实时查）
      function fetchBalance() {
        document.getElementById('buy-btn').textContent = '查询中...';
        fetch('https://100000whys.cn/fsj/api/user/code2session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ openid: openid })
        })
          .then(function (res) { return res.json(); })
          .then(function (res) {
            if (res.code === 200 && res.data && res.data.user) {
              userBalance = parseFloat(res.data.user.balance) || 0;
              document.getElementById('balance-display').textContent = userBalance.toFixed(2);
              updateBuyButton();
            } else {
              showStatus('查询余额失败', 'error');
            }
          })
          .catch(function () {
            showStatus('网络异常', 'error');
          });
      }

      // 更新购买按钮状态
      function updateBuyButton() {
        var btn = document.getElementById('buy-btn');
        var deductInfo = document.getElementById('deduct-info');
        if (userBalance >= productPrice) {
          deductInfo.textContent = '余额充足，将全额使用余额支付';
          btn.textContent = '立即购买（余额抵扣）';
          btn.disabled = false;
        } else if (userBalance > 0) {
          var remain = (productPrice - userBalance).toFixed(2);
          deductInfo.textContent = '余额不足，需补 ' + remain + ' 元';
          btn.textContent = '立即购买（余额+' + remain + '元）';
          btn.disabled = false;
        } else {
          deductInfo.textContent = '';
          btn.textContent = '立即购买';
          btn.disabled = false;
        }
      }

      // 购买逻辑 — 通知小程序统一下单 + 拉起支付
      document.getElementById('buy-btn').addEventListener('click', function () {
        if (!openid) {
          showStatus('请先登录', 'error');
          return;
        }

        showStatus('正在下单...', '');

        // 计算微信支付金额（元转分）
        var wxFee = Math.round((productPrice - Math.min(userBalance, productPrice)) * 100);
        if (wxFee < 1) wxFee = 1; // 最低 1 分

        // 通知小程序端统一下单（商户密钥在小程序代码中，前端不暴露）
        if (window.Bridge) {
          Bridge.doPayment({
            body: '测试商品',
            total_fee: wxFee
          });
        } else {
          // 非小程序环境：直接调用统一下单接口（调试用）
          directPay(wxFee);
        }
      });

      // 监听支付结果
      if (window.Bridge) {
        Bridge.onPaymentResult(function (result) {
          if (result.success) {
            showStatus('支付成功！', 'success');
            fetchBalance();
          } else {
            showStatus('支付失败: ' + (result.error || ''), 'error');
          }
        });
      }

      // 调试用：直接在 H5 环境调用统一下单（需要商户密钥，仅开发调试）
      function directPay(totalFee) {
        var appId = localStorage.getItem('fsj_appid') || '';
        var mchId = localStorage.getItem('fsj_mch_id') || '';
        var apiKey = localStorage.getItem('fsj_pay_api_key') || '';

        if (!appId || !mchId || !apiKey) {
          showStatus('缺少支付配置（非小程序环境需手动配置）', 'error');
          return;
        }

        var orderNo = 'ORDER' + Date.now() + Math.random().toString(36).substr(2, 4).toUpperCase();

        fetch('https://100000whys.cn/api/pay/unified', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            appid: appId,
            mch_id: mchId,
            api_key: apiKey,
            openid: openid,
            out_trade_no: orderNo,
            body: '测试商品',
            total_fee: totalFee
          })
        })
          .then(function (res) { return res.json(); })
          .then(function (res) {
            if (res.code !== 200) {
              showStatus('下单失败: ' + res.message, 'error');
              return;
            }
            showStatus('下单成功（H5 调试模式，无法拉起支付）', 'success');
          })
          .catch(function (err) {
            showStatus('网络异常: ' + err.message, 'error');
          });
      }

      function showStatus(msg, type) {
        var el = document.getElementById('status-msg');
        el.textContent = msg;
        el.className = 'status' + (type ? ' ' + type : '');
      }
    })();
  </script>

</body>
</html>
