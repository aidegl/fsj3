<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>fsj-tuijian · 抖音式推荐</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="index.css?v=__VERSION__">
    <link rel="stylesheet" href="pages/tuijian/index.css?v=__VERSION__">
    <link rel="stylesheet" href="components/TuijianCard/index.css?v=__VERSION__">
    <link rel="stylesheet" href="components/ActionBar/index.css?v=__VERSION__">
    <link rel="stylesheet" href="components/AuthorBar/index.css?v=__VERSION__">
    <link rel="stylesheet" href="components/CommentSheet/index.css?v=__VERSION__">
</head>
<body>
    <div id="app"></div>
    <script>
        window.__VERSION__ = Date.now();
        // 动态 rem 适配（750px 设计稿）：1rem = 视口宽 / 7.5
        (function () {
            function setRem() {
                var w = document.documentElement.clientWidth;
                document.documentElement.style.fontSize = (w / 7.5) + 'px';
            }
            setRem();
            window.addEventListener('resize', setRem);
        })();
    </script>
    <script type="module" src="index.js?v=__VERSION__"></script>
</body>
</html>
