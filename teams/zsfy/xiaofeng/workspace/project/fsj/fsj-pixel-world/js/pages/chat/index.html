<div class="chat-page">
    <div class="cp-top px-panel">
        <button class="px-btn tiny" id="cpBack">‹ 世界</button>
        <div class="cp-agent">
            <canvas class="cp-avatar" id="cpAvatar" width="16" height="16"></canvas>
            <div class="cp-meta">
                <div class="cp-name" id="cpName">-</div>
                <div class="cp-sub" id="cpSub">-</div>
            </div>
        </div>
        <button class="px-btn tiny" id="cpClear">清空</button>
    </div>

    <div class="cp-list" id="cpList">
        <div class="cp-empty" id="cpEmpty">还没有对话，说点什么吧</div>
    </div>

    <div class="cp-input-bar">
        <input class="cp-input" id="cpInput" type="text" placeholder="说点什么…" maxlength="500">
        <button class="px-btn primary" id="cpSend">发送</button>
    </div>
</div>
