<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>fsj-game-world-god · 主界面 v2</title>
<style>
/* ============================================================
   布局 v3（老板拍板）：Godot 实机 = 整页背景层（与草地同层），UI 全部悬浮其上
   页面=列容器[顶栏 + 内容区(行容器)]
   内容区=行容器[左决策卡(240px) + 中间列容器(flex:1,只放底栏:计划流+流模块,贴底) + 右行动记录(300px)]
   空白区点击穿透 → 进游戏；点面板 → 回壳。固定 UI 弹性铺满，不缩放不黑边
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#16121f}
body{font:13px/1.5 'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#eef2f8}
.glow{background:rgba(13,16,23,.9);border:1px solid rgba(255,255,255,.5);border-radius:12px;box-shadow:0 0 10px 0 rgba(0,255,255,.45)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* 背景层：草地（Godot 加载前的垫底） + Godot 实机（整页背景，同一层） */
#grass{position:fixed;inset:0;background:url(assets/tile-grass3-96.png) repeat;background-size:96px 96px;z-index:0}
#gamewrap{position:fixed;inset:0;z-index:1}
#game{width:100%;height:100%;border:0;display:block}
#gamegate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:transparent;cursor:pointer;z-index:2}
#gamegate .tip{background:rgba(8,15,27,.85);border:1px solid rgba(47,214,197,.5);border-radius:8px;padding:8px 22px;font-size:13px;opacity:0;transition:opacity .4s}
#gamewrap:hover .tip{opacity:1}

/* UI 悬浮层：容器不拦截点击（穿透进游戏），仅面板可点 */
#win{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;pointer-events:none}
#top,#left,#right,#bottom{pointer-events:auto}

/* 顶栏（行） */
#top{height:60px;flex:none;background:#070b12;display:flex;align-items:center;gap:26px;padding:0 22px}
#top .logo{display:flex;align-items:center;gap:10px}
#top nav{display:flex;gap:6px;margin-left:210px}
#top nav a{color:#9a94b5;text-decoration:none;font-size:13px;padding:6px 18px;border-radius:17px;border:1px solid transparent}
#top nav a.on{color:#fff;background:#131a26;border:1px solid #2fd6c5}
#top .right{margin-left:auto;display:flex;gap:20px;font-size:12px;color:#9a94b8;align-items:center}
#top .pill{background:#131a26;border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:4px 13px}

/* 内容区（行容器） */
#content{flex:1;display:flex;gap:5px;padding:5px 0 5px 0;min-height:0}

/* 左：决策卡（240px） */
#left{width:360px;flex:none;padding:22px 13px 12px;display:flex;flex-direction:column;align-items:center;min-height:0;border-radius:0 12px 12px 0;border:0}
#left img#ava{width:138px;height:138px;border-radius:50%;object-fit:cover;border:2px solid #2fd6c5;box-shadow:0 0 12px rgba(47,214,197,.35)}
#left .name{font-family:'Noto Serif SC','Songti SC',serif;font-size:25px;letter-spacing:13px;margin:18px 0 6px;text-indent:13px}
#left .lvrow{display:flex;justify-content:space-between;align-items:baseline;width:calc(100% - 20px);margin:10px 10px 6px}
#left .lvt{font-size:15px;font-weight:700;color:#e8e8e8}
#left .lxp{font-size:11px;color:#6c9be8}
#left .lv b{color:#6c9be8;font-weight:400}
#left .exp{height:7px;border-radius:3px;background:#22314a;overflow:hidden;margin:0 10px 16px;width:calc(100% - 20px)}
#left .exp i{display:block;height:100%;width:62%;background:linear-gradient(90deg,#1174ff,#6c9be8)}
.ptabs{display:flex;gap:2px;width:100%;padding:0 2px;margin-bottom:10px}
.ptabs span{flex:1;text-align:center;padding:10px 0 9px;font-size:16px;color:#9a94b5;border-bottom:2px solid transparent;background:none}
.rtabs{display:none;gap:6px;width:100%;padding:6px 2px}
.rtabs span{flex:1;text-align:center;padding:3px 14px;border-radius:13px;font-size:13px;color:#9a94b5;border:1px solid transparent;cursor:pointer}
.rtabs span.on{color:#fff;background:#131a26;border-color:#2fd6c5}
.ttabs{display:flex;gap:6px;width:100%;padding:6px 2px;justify-content:center}
.ttabs span{flex:1;text-align:center;padding:3px 14px;border-radius:13px;font-size:13px;color:#9a94b5;border:1px solid transparent;cursor:pointer}
.ttabs span.on{color:#fff;background:#131a26;border-color:#2fd6c5}
.ptabs span.on{color:#fff;border-bottom:2px solid #2fd6c5}
#decards{width:100%;flex:1;overflow-y:auto;min-height:0}
.dcard{border-radius:10px;padding:13px 16px 10px;margin:10px 3px;cursor:pointer;background:#101d31;position:relative;filter:saturate(.74) opacity(.96)}
.dcard .t{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-size:17px;font-weight:500;color:var(--dk)}
.dcard.sel .t{color:var(--dks);font-weight:900}
.dcard .sub{margin-top:9px;border-radius:6px;padding:0;font-size:14px;color:rgba(255,255,255,.92);display:flex;justify-content:space-between;align-items:center}
.dcard .sub .pct{font-size:16px;font-weight:700;color:#fff}
.dcard.teal{background:#5193FF;--dk:#2A1E93;--dks:#2A1E93;--sub:rgba(0,0,0,.22);--bg:#4d86f7}.dcard.gray{background:#5e5878;--dk:#26222f;--dks:#141118;--bg:#5e5878}.dcard.blue{background:#3d87ff;--dk:#eaf2ff;--dks:#ffffff;--sub:rgba(255,255,255,.12);--bg:#0e1726}
.dcard.dcard.blue{background:#0e1726;overflow:hidden;padding:0}
.dcard.blue::before{content:"";position:absolute;inset:-140%;background:conic-gradient(from 0deg,#1174ff,#17cc68,#0a45c4,#1174ff);animation:ringspin 3s linear infinite;z-index:0}
.dcard.blue .dbody{background:#0e1726;margin:2px;border-radius:9px;position:relative;z-index:1}
@keyframes ringspin{to{transform:rotate(360deg)}}
.dcard.dcard.sel:not(.blue){filter:none;opacity:1;padding:0}
.dcard.dcard.sel.dim{background:transparent;border-color:#DFDFDF}
.dcard.dcard.sel.dim .dbody{background:transparent}
.dcard.dcard.sel:not(.blue):not(.dim) .dbody{background:var(--bg);}
.dcard .dbody{background:var(--bg);border-radius:8px;margin:0;padding:12px 12px 9px 10px}
.dcard.block{background:#17A1A1;--sub:rgba(0,0,0,.22);--dk:#0C3A76;--dks:#062650;border:0;--bg:#17A1A1}
.dcard.veto{background:#747474;--sub:rgba(0,0,0,.25);--dk:#181818;--dks:#181818;border:0;--bg:#747474}
.dcard.dim .sub{color:#747474}.dcard.dim .sub .pct{color:#747474}
.dcard.dim{background:transparent;border:1px solid #747474;--sub:rgba(116,116,116,.22);--dk:#747474;--dks:#DFDFDF;--bg:#101d31}
.dcard.dim .sub{color:#747474}

/* 中：列容器（只放底栏，贴底；空白穿透进游戏） */
#centercol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-width:0;min-height:0}

/* 底栏 = 计划流 + 流模块（行容器，贴底，内边距收紧） */
#bottom{height:428px;flex:none;display:flex;min-height:0;border:0}
#dstatement{flex:1.18;padding:12px 21px;min-width:0;overflow:hidden}
#dstatement .st{font-size:20px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:6px}
#dstatement .st b{font-size:28px;color:#c6cfdb;font-weight:600}
#dstatement .st b i{font-size:16px;color:#9a94b5;font-style:normal;margin-left:3px}
#dstatement .hits{margin-top:9px;font-size:16px;color:#cfd6e4;max-height:156px;overflow-y:auto}
#dstatement .hits .fl{margin:5px 0 9px}
#dstatement .hits .fl.dim{opacity:.5}
#dstatement .hits .k{color:#6c9be8}
#dstatement .hits .head1{color:#17cc68}
.vdiv{width:1px;background:rgba(255,255,255,.15);margin:8px 0}
#dtree{flex:.78;padding:12px 21px;overflow:hidden}
#dtree .cap{font-size:16px;color:#9a94b5;margin-bottom:6px}

/* 右：行动记录（300px） */
#right{width:450px;flex:none;padding:21px;display:flex;flex-direction:column;min-height:0;border-radius:12px 0 0 12px;border:0}
#right .hd{display:flex;justify-content:space-between;align-items:baseline;font-size:21px;font-weight:700;margin-bottom:15px}
#right .hd .live{font-size:15px;color:#3fb950;font-weight:400}
.chips{display:flex;gap:2px;margin-bottom:4px}
.chips span{flex:1;text-align:center;font-size:16px;color:#9a94b5;padding:7px 0 6px;background:none;border-bottom:2px solid transparent}
.chips span.on{color:#fff;background:none;border-bottom:2px solid #2fd6c5}
#feed{flex:1;overflow-y:auto;margin:0 -4px;padding:0 4px;min-height:0}
.fitem{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:16px}
.fitem .l1{display:flex;gap:9px;align-items:baseline}
.fitem .tm{color:#9a94b5;font-size:15px}
.fitem .who{font-weight:700;font-size:17px}
.fitem .what{color:#8494ab;margin-top:2px}
#stats{border-top:1px solid rgba(255,255,255,.08);margin-top:10px;padding-top:10px;font-size:16px;color:#9a94b5;display:flex;justify-content:space-between}
#stats .link{color:#2fd6c5}
#stats .nums{display:flex;gap:22px;margin-top:6px;justify-content:flex-end}
#stats .nums div{text-align:center}
#stats b{display:block;font-size:28px;color:#fff;font-weight:700}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#22314a;border-radius:3px}
/* ===== 计划流列表（Figma 792:28939 分块） ===== */
#bottom{height:428px}
#flowlist{flex:1.18;min-width:0;overflow-y:auto;padding:6px 4px}
.frow{display:flex;align-items:flex-start;padding:4px 0;min-height:26px;font-size:14px;line-height:1.45;cursor:pointer;border-radius:4px}
.frow:hover{background:rgba(255,255,255,.04)}
.frow.dimrow{opacity:.45}
.slot1{width:32px;flex:none;display:flex;justify-content:center;align-items:center;margin-top:6px}
.slot2{width:22px;flex:none;display:flex;justify-content:center;align-items:center;margin-top:6px}
.ftext{flex:1;white-space:normal;word-break:break-word;line-height:1.45;padding-right:6px}
.dia{width:13px;height:9px;display:block;transform:rotate(90deg)}
.dia.diahide{visibility:hidden}
.frow.uns{opacity:.5}
.ic{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.ic-done{background:#17cc68}
.ic-todo{border:1.5px solid #9a94b5}
.ic-run{border:1.5px solid #2fd6c5;animation:fillp 1.6s ease-in-out infinite alternate}
@keyframes fillp{from{background:transparent}to{background:#2fd6c5}}
.ic-pause{width:4px;height:10px;border-radius:1px;background:#e3b341;box-shadow:6px 0 0 #e3b341;margin-right:6px}
.ic-x{width:10px;height:10px;border-radius:0;position:relative}
.ic-x::before,.ic-x::after{content:'';position:absolute;left:4px;top:-1px;width:2px;height:12px;background:#ff8080}
.ic-x::before{transform:rotate(45deg)}.ic-x::after{transform:rotate(-45deg)}
.rcard{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:9px 11px;margin:6px 2px;font-size:12px;color:#8494ab}
.rcard b{display:block;color:#eef2f8;font-size:12.5px;margin-bottom:2px}
.tichip{display:inline-block;margin-left:8px;padding:0 7px;border:1px dashed rgba(47,214,197,.55);border-radius:8px;font-size:10px;color:#2fd6c5;height:15px;line-height:14px;vertical-align:1px}
.frow.compile{color:#2fd6c5}
.comp-spin{width:9px;height:9px;border-radius:50%;border:2px solid #2fd6c5;border-top-color:transparent;display:inline-block;animation:ringspin 1s linear infinite}
.ftext.compiling,.ftext .cc{color:#2fd6c5}
@keyframes kb{0%,100%{opacity:1}50%{opacity:.2}}
.blink{display:inline-block;animation:kb 1.1s ease-in-out infinite}
.dots::after{content:'';animation:dots 1.4s steps(1) infinite}
@keyframes dots{0%{content:' ·'}25%{content:' ··'}50%{content:' ···'}75%{content:' ····'}}

.k{color:#6c9be8}


/* 任务列表（左栏） */
#tasklist{width:100%;flex:1;display:flex;flex-direction:column;gap:0;min-height:0}
#taskitems{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:5px}
#tasklegend{width:100%;display:flex;gap:8px 14px;padding:12px 14px 14px;font-size:11px;color:#9a94b5;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.08);margin-top:auto;align-items:center}
.tlegend span{display:inline-flex;align-items:center}
.tlegend .sw{width:8px;height:8px;border-radius:50%;flex:none;margin-right:5px;display:inline-block}
.tcap{font-size:11.5px;color:#7faaf0;letter-spacing:1px;margin:8px 0 6px;text-transform:uppercase}
.tdcap{font-size:12px;color:#9a94b5;padding:0 2px 6px}
.trow{display:flex;flex-direction:column;gap:8px}
.titem{display:flex;gap:9px;padding:10px 14px;border-radius:8px;cursor:pointer;flex:1;min-width:0;background:rgba(255,255,255,.03);border:1px solid transparent}
.titem.on{background:rgba(88,166,255,.12);border:1px solid rgba(88,166,255,.35)}
.tdot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
.tdextra{display:none;padding:6px 6px 8px 14px;color:#cfd6e4;font-size:12.5px;line-height:1.65}
.tdextra .row{margin:3px 0;white-space:pre-wrap}
.tdextra b{color:#9a94b5;font-weight:500;margin-right:4px}
.tdextra .out{color:#3fb950;border-left:2px solid #3fb950;padding-left:8px;margin-top:6px}
.trow.on .tdextra{display:block}
.pnum{flex:none;align-self:center;margin-left:18px;font:bold 14px Consolas,monospace;color:#fff}
#sdetail{padding:4px 0;max-height:180px;overflow-y:auto}
.dcap{font-size:10.5px;color:#9a94b5;margin:2px 0}
.drow{font-size:11px;color:#cfd6e4;margin:3px 0;line-height:1.5}
.dtab{width:100%;border-collapse:collapse;font-size:10px;margin:4px 0}
.dtab th{color:#9a94b5;font-weight:500;text-align:left;padding:2px 4px;border-bottom:1px solid rgba(255,255,255,.1)}
.dtab td{padding:2px 4px;border-bottom:1px solid rgba(255,255,255,.04);color:#cfd6e4}
.mchip{display:inline-block;padding:1px 6px;border:1px dashed rgba(47,214,197,.5);border-radius:6px;font-size:10px;color:#2fd6c5;margin-right:4px}
.bchip{display:inline-block;padding:1px 6px;border:1px solid #2fd6c5;border-radius:6px;font-size:10px;color:#2fd6c5;margin-right:4px}
.bchip.aux{border-style:dashed;color:#9a94b5;border-color:#9a94b5}
.emob{display:inline-block;padding:1px 8px;border-radius:8px;font-size:10px;background:#17cc68;color:#16121f;font-weight:600}
.tbodyx{flex:1;min-width:0}
.tt1{font-size:13px;font-weight:600;color:#eef2f8;line-height:1.4;word-break:break-word;white-space:normal}
.tt2{font-size:10.5px;color:#9a94b5;margin-top:2px}
.flflag{color:#2fd6c5;margin-left:5px;font-size:11px}
.flcap2{font-size:11px;color:#9a94b5;padding:2px 2px 6px}

</style>
</head>
<body>
  <!-- 背景层 z0：草地垫底（Godot 加载完成即被盖住） -->
  <div id="grass"></div>
  <!-- 背景层 z1：Godot 实机 = 整页背景，与草地同层 -->
  <div id="gamewrap">
    <iframe id="game" src="godot/build/index.html" title="像素视界2.0·上帝端游戏"></iframe>

  </div>

  <!-- UI 悬浮层 z10：面板可点，空白穿透进游戏 -->
  <div id="win">
    <div id="top">
      <div class="logo" style="display:flex;align-items:center;gap:10px">
        <img src="assets/figma/imgTitle.svg" style="height:30px" alt="FSJ">
        <img src="assets/figma/imgGameWorld.svg" style="height:15px" alt="GAME WORLD">

      <div id="left" class="glow">
        <img id="ava" src="assets/figma/img20260413163909130561.png" alt="祈景宗">

<div class="rtabs" id="rtabs"><span class="on">必读</span><span>情绪</span><span>八神</span><span>通用</span><span>智能</span></div>

        </div></div>

  </div>

<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AGENT_COLOR={'小风':'#ff8080','阿说':'#ffc229','小粽':'#6c9be8','梦瑶':'#7faaf0','椰果':'#ffc229','小云':'#7ee06a','无名':'#9a94b5','林东城':'#2fd6c5'};
const pctOf=st=>st==='done'?[100,'teal']:st==='running'?[72,'blue']:st==='blocked'?[30,'block']:st==='veto'?[0,'veto']:[0,'dim'];
const ST_ICON={done:'<span class="ic ic-done"></span>',running:'<span class="ic ic-run"></span>',blocked:'<span class="ic ic-pause"></span>',veto:'<span class="ic ic-x"></span>',todo:'<span class="ic ic-todo"></span>'};
const ST_EMO={done:'😊 符合预期',running:'⌨ <span class="cc">正在 coding…</span>',veto:'⛔ 已否决',todo:'◻ 等待启动'};
const EMO_EMOJI={'顺畅':'😌','平静':'😐','困惑':'🤔','兴奋':'🤩','焦虑':'😰','满足':'😌','疲惫':'😵','好奇':'🤔','挫败':'😤','成就':'🥳'};
const emoIcon=e=>EMO_EMOJI[e]||'📝';
let DATA=null,TASK=-1,FLOWID=null,SEL=-1;
document.getElementById('clock').textContent='2026-10-09 '+new Date().toTimeString().slice(0,5);

function planSteps(){return (DATA&&DATA.plan&&DATA.plan.steps)||[];}
function activeFlow(){return ((DATA&&DATA.flows)||[]).find(x=>x.id===FLOWID)||null;}

/* 左栏：任务（目标）列表 */
let TASKTAB='all';
function renderTasks(){
  const ps=planSteps(); if(!ps.length)return;
  const tabs=`<div class="ttabs"><span class="${TASKTAB==='all'?'on':''}" onclick="setTaskTab('all')">全部</span><span class="${TASKTAB==='org'?'on':''}" onclick="setTaskTab('org')">组织</span><span class="${TASKTAB==='done'?'on':''}" onclick="setTaskTab('done')">已完成</span></div>`;
  const items=ps.map((s,i)=>({s,i})).filter(({s})=>TASKTAB==='done'?s.status==='已完成':(TASKTAB==='org'?s.status!=='已完成':true));
  const body=items.map(({s,i})=>{
    const pnum=`<span class="pnum">P${i+1}</span>`;
    const c=s.status==='已完成'?'#17cc68':s.status==='进行中'?'#58a6ff':'#9a94b5';
    const fl=(s.flows&&s.flows.length)?'<span class="flflag">⧉</span>':'';
    return `<div class="trow${i===TASK?' on':''}" onclick="selectTask(${i})"><div class="titem${i===TASK?' on':''}"><span class="tdot" style="background:${c}"></span><div class="tbodyx"><div class="tt1">${esc(s.title)}${fl}</div></div>${pnum}</div><div class="tdextra"><div class="row"><b>截止：</b>${esc(s.due||'—')}</div><div class="row"><b>详情：</b>${esc(s.detail||'（暂无）')}</div><div class="row out"><b>验收：</b>${esc(s.output||'—')}</div></div></div>`;
  }).join('');
  document.getElementById('tasklist').innerHTML='<div id="taskitems">'+tabs+(items.length?body:'<div class="tcap" style="opacity:.5;padding:8px 2px">此视图暂无任务</div>')+'</div><div id="tasklegend" class="tlegend"><span><i class="sw" style="background:#17cc68"></i>已完成</span><span><i class="sw" style="background:#58a6ff"></i>进行中</span><span><i class="sw" style="background:#ff8080"></i>卡住</span><span><i class="sw" style="background:#9a94b5"></i>未开始/否决</span></div>';
}
function setTaskTab(x){TASKTAB=x;renderTasks();}
function defaultSel(f){
  if(!f||!f.steps)return 0;
  const st=f.steps;
  let i=st.findIndex(s=>s.compile==='running'||s.status==='running');
  if(i<0){for(let j=st.length-1;j>=0;j--){if(st[j].status==='done'){i=j;break;}}}
  return i<0?0:i;
}
function selectTask(i){
  TASK=i; const s=planSteps()[i]||{};
  FLOWID=(s.flows&&s.flows[0])||null; SEL=defaultSel(activeFlow());
  renderTasks(); renderFlows(); renderTree();
  const td=document.getElementById('taskdetail');
  if(td){td.style.display='flex';td.innerHTML=`<button class="back" onclick="hideTaskDetail()">← 返回任务列表</button><div class="tdc"><h4>${esc(s.title||'(无标题)')}</h4><div class="tag">${esc(s.p||'')} · ${esc(s.status||'—')} · 截止 ${esc(s.due||'—')}</div><div class="body">${esc(s.detail||'(暂无详情)')}</div><div class="out">验收：${esc(s.output||'—')}</div></div>`;}
}
function hideTaskDetail(){const td=document.getElementById('taskdetail');if(td)td.style.display='none';}

/* 底部左：选中任务的计划流（流里面的每一项） */
function hitLine(s){
  if(s.demoHits&&s.demoHits.length){
    const total=s.demoHits.reduce((x,d)=>x+d.count,0);
    return s.demoHits.map(d=>`<span class="k">[${esc(d.channel)}]</span> 命中 ${d.count} 条`).join(' ');
  }
  const q=(s.title||'').slice(0,6);
  const hs=(DATA.hits||[]).filter(h=>(h.q||'').includes(q)||q.includes((h.q||'').slice(0,4)));
  if(!hs.length) return '';
  const h=hs[0]; const n=h.hits||0;
  return `<b style="color:#cfd6e4">[${esc(h.agent)}] 命中 ${n}条</b> <span class="k">[向量·(搜索的向量内容)]</span> 命中 ${Math.max(1,Math.round(n/2))} 条 <span class="k">[HapKeywords·(标题)(大的)]</span> 命中 ${Math.max(1,Math.round(n/3))} 条`;
}
function renderFlows(){
  const el=document.getElementById('flowlist');
  const f=((DATA&&DATA.flows)||[]).find(x=>x.id===FLOWID)||activeFlow(); let compUsed=false;
  if(!f){el.innerHTML='<div class="frow"><span class="ftext" style="opacity:.5">该任务尚未建流（建流后此处显示流里的每一项）</span></div>';return;}
  el.innerHTML=`<div class="flcap2">${esc(f.task||f.id)}</div>`+f.steps.map((s,i)=>{
    const comp=(s.compile==='running'&&!compUsed);
    if(s.compile==='running')compUsed=true;
    const nowHit=(DATA&&DATA.now&&DATA.now.step_no===s.no&&s.status==='running'&&(Date.now()-(DATA.now.ts||0))<180000);
    const bl=Array.isArray(s.bashen)?s.bashen:(s.bashen?[s.bashen.main,s.bashen.aux].filter(Boolean):[]);
    const bs=bl.map((x,k)=>'<span class="bchip'+(k?' aux':'')+'">'+x+(k?'·辅':'·主')+'</span>').join('');
    const emo=nowHit?'<span class="blink">⌨</span> <span class="cc">正在执行 s'+s.no+' '+s.title+' —— '+(DATA.now.action||'')+'</span>'+(bs?'<span class="bchip" style="margin-left:8px">八神:'+bs+'</span>':''):(s.emo?'<span class="emob">'+emoIcon(s.emo)+' '+s.emo+'</span> ':(s.continuous?'⚙ 持续观察中…':(s.compile==='running'&&comp?'':(s.status==='blocked'?('🤔 困惑 · '+(s.blockedOn||'等待')):(s.status==='todo'?'':(ST_EMO[s.status]||''))))))+((emo&&bs)?' '+bs:bs);
    const ti=(s.module||'').includes('Ti')?'<span class="tichip" title="Ti模块是共享数据：其他流亦可编辑引用">⧉ Ti模块 · 共享数据</span>':'';
    let html=`<div class="frow${i===SEL?'':' uns'}" onclick="focusFlow(${i})">
      <span class="slot1"><img class="dia${i===SEL?'':' diahide'}" src="assets/figma/dia-marker.svg" alt=""></span>
      <span class="slot2">${comp?'<span class="comp-spin"></span>':(ST_ICON[s.status]||ST_ICON.todo)}</span>
      <span class="ftext">${esc(s.title)}${ti}</span></div>`;
    const hl=hitLine(s);
    if(hl) html+=`<div class="frow sub${i===SEL?'':' uns'}" onclick="focusFlow(${i})"><span class="slot1"></span><span class="slot2"></span><span class="ftext">${hl}</span></div>`;
    if(emo) html+=`<div class="frow sub${i===SEL?'':' uns'}" onclick="focusFlow(${i})"><span class="slot1"></span><span class="slot2"></span><span class="ftext">${emo}</span></div>`;
    if(comp){
      html+=`<div class="frow sub" onclick="focusFlow(${i})"><span class="slot1"></span><span class="slot2"></span><span class="ftext compiling">正在对流进行编译<span class="dots"></span></span></div>`;
    }
    return html;
  }).join('');
}
function focusFlow(i){ if(SEL!==i){SEL=i;renderFlows();renderDetail(i);} }
function renderDetail(i){
  const f=((DATA&&DATA.flows)||[]).find(x=>x.id===FLOWID)||activeFlow(); if(!f)return;
  const s=f.steps[i]; if(!s)return;
  const dt=document.getElementById('sdetail'); if(!dt)return;
  const bl=Array.isArray(s.bashen)?s.bashen:(s.bashen?[s.bashen.main,s.bashen.aux].filter(Boolean):[]);
  const bsChips=bl.map((x,k)=>'<span class="bchip'+(k?' aux':'')+'">'+x+(k?'·辅':'·主')+'</span>').join(' ');
  const modChips=(s.module||'').split('+').filter(Boolean).map(m=>'<span class="mchip">'+m.trim()+'</span>').join(' ');
  let html='<div class="dcap">步骤详情 · s'+s.no+'</div>';
  html+='<div class="drow"><b>'+esc(s.title)+'</b></div>';
  html+='<div class="drow">'+modChips+(bsChips?' '+bsChips:'')+'</div>';
  if(s.emo) html+='<div class="drow"><span class="emob">'+s.emo+'</span></div>';
  if(s.status==='blocked') html+='<div class="drow" style="color:#ff8080">⛔ 困惑：'+esc(s.blockedOn||'')+'</div>';
  if(s.decision) html+='<div class="drow">选：'+esc(s.decision.chosen)+' · 因：'+esc(s.decision.why)+'</div>';
  if(s.output) html+='<div class="drow" style="color:#9a94b5">产出：'+esc(s.output)+'</div>';
  // 八神 → mermaid 可视化
  if(bl.length>=2){
    const mid='mm'+Date.now();
    html+='<div class="drow"><div id="'+mid+'" style="background:rgba(13,16,23,.6);border-radius:8px;padding:6px"></div></div>';
    const def='graph LR\n  S[s'+s.no+' · '+s.title.slice(0,8)+'] --> M['+bl[0]+' · 主]\n  S --> A['+bl[1]+' · 辅]\n  M -.->|性格策略| A\n  style M fill:#1aa39b,color:#fff\n  style A fill:#5e5878,color:#fff';
    setTimeout(()=>{
      try{ if(window.mermaid){ mermaid.initialize({startOnLoad:false,theme:'dark',securityLevel:'loose'});
        mermaid.render('svg'+mid,def).then(r=>{const el=document.getElementById(mid);if(el)el.innerHTML=r.svg;}).catch(()=>{});
      }}catch(e){}
    },50);
  }
  // demoHits → 七列表格
  const hls=s.demoHits||[];
  if(hls.length){
    html+='<div class="drow" style="margin-top:4px"><b>检索结果</b></div>';
    html+='<table class="dtab"><tr><th>时间</th><th>检索方式</th><th>查询</th><th>命中</th><th>Top1</th><th>关联</th><th>漏召</th></tr>';
    hls.forEach(h=>{
      html+='<tr><td>'+esc(h.t||'—')+'</td><td>'+esc(h.way||h.channel||'—')+'</td><td>'+esc(h.q||'—')+'</td><td>'+(h.hits!==undefined?h.hits:(h.count!==undefined?h.count:'—'))+'</td><td>'+esc(String(h.top||'—').slice(0,14))+'</td><td>'+(h.rel!==undefined?h.rel:'—')+'</td><td style="color:'+(h.miss?'#ff8080':'inherit')+'">'+(h.miss?'是':'否')+'</td></tr>';
    });
    html+='</table>';
  }
  if(!bl.length&&!hls.length&&s.note) html+='<div class="drow" style="color:#9a94b5">note：'+esc(String(s.note).slice(0,60))+'</div>';
  dt.innerHTML=html;
}
function renderTree(){
  const f=activeFlow(); let compUsed=false; if(!f)return;
  const cols=['#1174ff','#17cc68','#9a94b5','#ff8080','#1174ff','#7ee06a','#17cc68','#ffc229'];
  const col=st=>st==='done'?'#17cc68':st==='running'?'#1174ff':st==='blocked'?'#ff8080':st==='veto'?'#9a94b5':'#9a94b5';
  const n=f.steps.length, x0=24, dx=Math.min(70,(380-x0-24)/Math.max(1,n-1)), y1=30, y2=100;
  let svg='';
  f.steps.forEach((s,i)=>{
    const x=x0+i*dx;
    svg+=`<rect x="${x-6}" y="${y1-6}" width="12" height="12" transform="rotate(45 ${x} ${y1})" fill="${col(s.status)}"/>`;
    svg+=`<rect x="${x-6}" y="${y2-6}" width="12" height="12" transform="rotate(45 ${x} ${y2})" fill="${cols[i%cols.length]}"/>`;
    if(i<n-1){const nx=x0+(i+1)*dx;
      svg+=`<path d="M${x+9} ${y1} L${nx-10} ${y1}" stroke="#2a3a55" stroke-width="1.6"/>`;
      svg+=`<path d="M${x} ${y1+9} C${x} ${y2}, ${nx} ${y1}, ${nx} ${y2-10}" stroke="${cols[(i+1)%cols.length]||'#7faaf0'}" stroke-width="1.3" fill="none" opacity=".8"/>`;}
  });
  document.getElementById('tree').innerHTML=svg;
}
function renderFeed(){
  const hs=DATA.hits||[];
  document.getElementById('feed').innerHTML=hs.slice(0,26).map(h=>{
    const c=AGENT_COLOR[h.agent]||'#9a94b5';
    return `<div class="fitem"><div class="l1"><span class="tm">${esc(h.t||'')}</span>
      <span class="who" style="color:${c}">${esc(h.agent||'')}</span></div>
      <div class="what">${esc((h.q||'').slice(0,30))} · ${esc(h.way)} · 命中${h.hits??'?'}</div></div>`;
  }).join('')||'<div class="fitem"><div class="what">暂无</div></div>';
  const miss=hs.filter(h=>h.miss).length;
  document.getElementById('st1').textContent=hs.length;
  document.getElementById('st2').textContent=hs.filter(h=>(h.hits||0)>0).length;
  document.getElementById('st3').textContent=miss;
}
function enterGame(){
  document.getElementById('gamegate').style.display='none';
  document.getElementById('game').focus();
}
async function load(){
  try{
    DATA=await (await fetch('/api/data')).json();
    if(TASK<0){const i=planSteps().findIndex(s=>s.flows&&s.flows.length);TASK=i>=0?i:0;}
    if(!FLOWID){const s=planSteps()[TASK];FLOWID=(s&&s.flows&&s.flows[0])||null;}
    if(SEL<0)SEL=defaultSel(activeFlow());
    renderTasks();renderFlows();renderTree();renderFeed();
  }catch(e){}
}
document.querySelectorAll('.ptabs span').forEach(tb=>tb.addEventListener('click',()=>{
      document.querySelectorAll('.ptabs span').forEach(x=>x.classList.remove('on'));
      tb.classList.add('on');
      const tab=tb.textContent;
      document.getElementById('rtabs').style.display=tab==='路由'?'flex':'none';
      document.getElementById('tasklist').style.display=tab==='任务'?'flex':'none';
      const rv=document.getElementById('routeview');
      if(rv) rv.style.display=tab==='路由'?'block':'none';
    }));
    document.querySelectorAll('.rtabs span').forEach(sb=>sb.addEventListener('click',()=>{
      document.querySelectorAll('.rtabs span').forEach(x=>x.classList.remove('on'));
      sb.classList.add('on');
    }));
    load();
    // WebSocket 实时推送（老板指定）：服务端 fs.watch 流文件变更即推，断线自动重连
    let ws = null, wsRetry = null;
    function wsConnect(){
      console.log('[WS] 连接中…');
      ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://') + location.host + '/ws');
      ws.onopen = () => { console.log('[WS] ✓ 已连接，收到init'); const d=document.getElementById('wsdot'); if(d){d.textContent='● 实时'; d.style.color='#3fb950';} };
      ws.onmessage = e => { const m = JSON.parse(e.data); console.log('[WS] 收到', m.type); if(m.data){ DATA=m.data; renderTasks(); renderFlows(); renderTree(); renderFeed(); console.log('[渲染] tasklist/flowlist/feed 已重绘 @', new Date().toTimeString().slice(0,8)); } };
      ws.onclose = () => { const d=document.getElementById('wsdot'); if(d){d.textContent='● 断线重连中'; d.style.color='#f85149';} clearTimeout(wsRetry); wsRetry=setTimeout(wsConnect,2000); };
      ws.onerror = () => { try{ws.close();}catch{} };
    }
    wsConnect();
document.getElementById('left').addEventListener('mousedown',()=>{const g=document.getElementById('gamegate');if(g)g.style.display='flex'});
document.getElementById('right').addEventListener('mousedown',()=>{const g=document.getElementById('gamegate');if(g)g.style.display='flex'});
document.getElementById('bottom').addEventListener('mousedown',()=>{const g=document.getElementById('gamegate');if(g)g.style.display='flex'});
</script>
