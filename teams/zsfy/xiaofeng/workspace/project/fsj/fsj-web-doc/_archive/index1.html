* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {

/* Topbar */
.topbar {
  position: sticky; top: 0; z-index: 100;
  height: 64px;
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center; padding: 0 32px;
}
.topbar-inner { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1400px; margin: 0 auto; }
.topbar-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text-primary); font-weight: 700; font-size: 1.0625rem; }
.topbar-logo .logo-text { display: flex; flex-direction: column; line-height: 1.2; }
.topbar-logo .logo-text small { font-size: 11px; color: var(--text-tertiary); font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
.topbar-nav { display: flex; align-items: center; gap: 8px; }
.topbar-nav a { padding: 8px 14px; border-radius: 8px; color: var(--text-secondary); font-size: 0.9375rem; font-weight: 500; transition: all 0.15s; text-decoration: none; }
.topbar-nav a:hover { background: var(--bg-subtle); color: var(--text-primary); }
.topbar-cta { margin-left: 8px; padding: 8px 16px; background: var(--accent-primary) !important; color: white !important; border-radius: 8px; font-weight: 600; font-size: 0.875rem; }
.topbar-cta:hover { background: var(--accent-primary-light) !important; transform: translateY(-1px); box-shadow: var(--shadow-md); }

/* Layout */
.layout {
  display: grid;
  grid-template-columns: 280px 1fr 240px;
  min-height: calc(100vh - 64px);
}
.main-wrapper {
  max-width: 880px;
  width: 100%;
  margin: 0 auto;
}

.sidebar-title { font-size: 0.75rem; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; padding: 0 12px; }
.nav-link { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; color: var(--text-secondary); font-size: 0.9375rem; font-weight: 500; transition: all 0.15s; text-decoration: none; cursor: pointer; }

const BACKEND_TREE = { loaded: false, loading: false, error: '', dirs: [] };

function hapPost(path, body) {
  return fetch(HAP_CFG.base + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'HAP-Appkey': HAP_CFG.appKey, 'HAP-Sign': HAP_CFG.sign },
    body: JSON.stringify(body)
  }).then(r => r.json());
}

function hapText(v) {
  if (v == null) return '';
  if (typeof v === 'string') return v;
  if (Array.isArray(v) && v.length) return (typeof v[0] === 'string') ? v[0] : (v[0].name || v[0].value || '');
  return '';
}

function fetchChildren(parentRowid) {
  return hapPost('/v3/app/worksheets/' + HAP_CFG.ws + '/rows/list', {
    pageSize: 100, pageIndex: 1,
    fields: ['title', 'content'],
    filter: { type: 'group', logic: 'AND', children: [ { type: 'condition', field: 'parent', operator: 'eq', value: parentRowid } ] }
  }).then(r => (r.data && r.data.rows) || []);
}

function loadBackendTree() {
  if (BACKEND_TREE.loaded || BACKEND_TREE.loading) return;
  BACKEND_TREE.loading = true;
  fetchChildren(HAP_CFG.dbPageRowid).then(dirs => {
    const jobs = dirs.map(d =>
      fetchChildren(d.rowId).then(leaves => {
        BACKEND_TREE.dirs.push({
          rowid: d.rowId,
          name: hapText(d.mingcheng) || d.rowId,
          leaves: leaves.map(l => ({
            rowid: l.rowId,
            name: hapText(l.mingcheng),
            wznr: hapText(l.wznr)
          }))
        });
      }).catch(() => {
        BACKEND_TREE.dirs.push({ rowid: d.rowId, name: hapText(d.mingcheng) || d.rowId, leaves: [] });
      })
    );
    return Promise.all(jobs);
  }).then(() => {
    BACKEND_TREE.loaded = true;
    BACKEND_TREE.loading = false;
    const cur = location.hash.slice(1).split('/')[0];
    if (cur === 'hap') Router.handleRoute();
  }).catch(e => {
    BACKEND_TREE.loading = false;
    BACKEND_TREE.error = (e && e.message) ? e.message : String(e);
    console.error('[HAP] 文档树加载失败:', e);
    const cur = location.hash.slice(1).split('/')[0];
    if (cur === 'hap') Router.handleRoute();
  });
}

// ===== webview2.0 路由渲染 =====
function WebviewPage(){
  const h = location.hash.slice(1);
  if (h.startsWith('webview/')) {
    const g = decodeURIComponent(h.slice(8));
    return renderWebviewGroup(g);
  }
  return renderWebviewIndex();
}
function renderWebviewIndex(){
  const names = Object.keys(WEBVIEW_B64);
  const cards = names.map(g => {
    const c = b64u(WEBVIEW_B64[g]);
    const n = (c.match(/<h2>/g)||[]).length;
    return '<a class="card" href="#webview/' + encodeURIComponent(g) + '"><div class="card-title">' + g + '</div><div class="card-desc">' + n + ' 个章节</div></a>';
  }).join('');
  return '<article><div class="hero"><div class="hero-badge"><span>●</span> 产品专题</div><h1 class="hero-title">webview2.0 深度</h1><p class="hero-subtitle">下一代小程序内嵌 H5 SPA 编辑器。三分离架构、Vite 驱动、Coze 流式响应、商家端完整指南。</p></div><h2>内容目录</h2><div class="card-grid">' + cards + '</div></article>';
}
function renderWebviewGroup(g){
  if (!WEBVIEW_B64[g]) return renderWebviewIndex();
  return '<article><div class="hero"><div class="hero-badge"><span>●</span> webview2.0</div><h1 class="hero-title">' + g + '</h1><p class="hero-subtitle">webview2.0 · ' + g + '</p></div><p><a href="#webview">← 返回目录</a></p>' + b64u(WEBVIEW_B64[g]) + '</article>';
}

function HapPage() {
  const h = location.hash.slice(1);
  if (h.startsWith('hap/')) return renderBackendGroup(decodeURIComponent(h.slice(4)));
  return renderBackendIndex();
}

function renderBackendIndex() {
  loadBackendTree();
  let cards;
  if (BACKEND_TREE.error) {
    cards = '<div style="padding:24px 0;color:#e11d48"><b>HAP 加载失败：</b>' + BACKEND_TREE.error + '<br><br><span style="color:var(--text-tertiary);font-size:0.875em">排查：① 看 F12 Console 红色报错 ② 若被浏览器拦截，改用 start-index1.bat（本地 http 服务）打开 ③ appkey/sign 已内置 HAP_CFG</span></div>';
  } else if (!BACKEND_TREE.loaded) {
    cards = '<p style="color:var(--text-tertiary);padding:24px 0">⟳ 正在从 HAP 加载文档树…</p>';
  } else if (!BACKEND_TREE.dirs.length) {
    cards = '<p style="color:var(--text-tertiary);padding:24px 0">HAP 文档树为空（检查 fsj-web-doc → 数据库 页面的子记录）</p>';
  } else {
    cards = BACKEND_TREE.dirs.map(g =>
      '<a class="card" href="#hap/' + encodeURIComponent(g.name) + '"><div class="card-title">' + g.name + '</div><div class="card-desc">' + g.leaves.length + ' 张表 · HAP 实时</div></a>'

// ===== 文档库 =====
function DocsPage(){
  const h = location.hash.slice(1);
  if (h.startsWith('docs/')) {
    return renderDocViewer(decodeURIComponent(h.slice(5)));
  }
  return renderDocList();
}
function renderDocList(){
  const names = Object.keys(MD_B64);
  const cards = names.map(n => '<a class="card" href="#docs/' + encodeURIComponent(n) + '"><div class="card-title">' + n + '.md</div><div class="card-desc">' + getMD(n).length + ' bytes</div></a>').join('');
  return '<article><div class="hero"><div class="hero-badge"><span>●</span> 文档库</div><h1 class="hero-title">所有 fsj 文档</h1><p class="hero-subtitle">点击查看。内容已内嵌到本 HTML，双击文件即可离线阅读。</p></div><h2>全部文档 (' + names.length + ')</h2><div class="card-grid">' + cards + '</div></article>';
}
function renderDocViewer(name){
  const c = getMD(name);
  if (!c) return renderDocList();
  return '<article><div class="doc-toolbar"><a class="back-link" href="#docs">← 返回文档列表</a><span class="doc-meta">' + name + '.md · ' + c.length + ' bytes</span></div>' + renderMarkdown(c) + '</article>';
}
function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function formatInline(t){
  let r = escapeHtml(t);
  r = r.replace(/`([^`]+)`/g,'<code>$1</code>');
  r = r.replace(/\*\*([^\*]+)\*\*/g,'<strong>$1</strong>');
  r = r.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  return r;
}
function renderMarkdown(md) {
  const lines = md.split('\n');
  let html = '', inCode = false, inList = false, code = '', items = [];
  const flush = () => { if (items.length) { html += '<ul>' + items.join('') + '</ul>'; items = []; } inList = false; };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith('\u0060\u0060\u0060')) {
      if (inCode) { html += '<pre><code>' + escapeHtml(code) + '</code></pre>'; code = ''; inCode = false; }
      else { flush(); inCode = true; }
      continue;
    }
    if (inCode) { code += line + '\n'; continue; }
    if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]*-+[\s:|-]*\|?\s*$/.test(lines[i+1])) {
      const tbl = [];
      let k = i;
      while (k < lines.length && /^\s*\|/.test(lines[k])) { tbl.push(lines[k]); k++; }
      if (tbl.length >= 2) {
        const cells = r => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => formatInline(c.trim()));
        let t = '<table><thead><tr>' + cells(tbl[0]).map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>';
        for (let r = 2; r < tbl.length; r++) t += '<tr>' + cells(tbl[r]).map(c => '<td>' + c + '</td>').join('') + '</tr>';
        html += t + '</tbody></table>';
        i = k - 1;
        continue;
      }
    }
    if (line.startsWith('#### ')) { flush(); html += '<h4>' + formatInline(line.slice(5)) + '</h4>'; continue; }
    if (line.startsWith('### ')) { flush(); html += '<h3>' + formatInline(line.slice(4)) + '</h3>'; continue; }
    if (line.startsWith('## ')) { flush(); html += '<h2>' + formatInline(line.slice(3)) + '</h2>'; continue; }
    if (line.startsWith('# ')) { flush(); html += '<h1>' + formatInline(line.slice(2)) + '</h1>'; continue; }
    if (/^\s*[-*]\s/.test(line)) { inList = true; items.push('<li>' + formatInline(line.replace(/^\s*[-*]\s+/, '')) + '</li>'); continue; }
    if (/^\s*\d+\.\s/.test(line)) { inList = true; items.push('<li>' + formatInline(line.replace(/^\s*\d+\.\s+/, '')) + '</li>'); continue; }
    if (line.startsWith('> ')) { flush(); html += '<blockquote>' + formatInline(line.slice(2)) + '</blockquote>'; continue; }
    if (line.trim() === '') { flush(); continue; }
    flush(); html += '<p>' + formatInline(line) + '</p>';
  }
  flush();
  if (inCode) html += '<pre><code>' + escapeHtml(code) + '</code></pre>';
  return html;
}

// ===== Router =====
const Router = {
  routes: {},
  init() {
    window.addEventListener('hashchange', () => this.handleRoute());
    this.handleRoute();
  },
  register(path, loader) { this.routes[path] = loader; },
  handleRoute() {
    const hash = window.location.hash.slice(1) || 'worldview';
    const [path] = hash.split('/');
    const loader = this.routes[path] || this.routes['worldview'];
    if (loader) {
      this.render(loader(), path);
      this.updateNav(path);
    }
  },
  render(html, path) {
    const main = document.getElementById('main-content');
    if (main) {
      main.innerHTML = html;
      window.scrollTo(0, 0);
      if (typeof TOC !== 'undefined' && TOC.build) setTimeout(() => TOC.build(), 0);
      window.dispatchEvent(new CustomEvent('content-loaded', { detail: { path } }));
    }
  },
  updateNav(activePath) {
    document.querySelectorAll('.nav-link').forEach(link => {
      link.classList.toggle('active', link.getAttribute('data-path') === activePath);
    });
  },
  navigate(path) { window.location.hash = '#' + path; }
};

const TOC = {
  init() {
    window.addEventListener('content-loaded', () => this.build());
    window.addEventListener('scroll', () => this.updateActive(), { passive: true });
  },
  build() {
    const main = document.getElementById('main-content');
    const tocList = document.getElementById('toc-list');
    if (!main || !tocList) return;
    const headings = main.querySelectorAll('h2, h3');
    tocList.innerHTML = '';
    if (headings.length === 0) { document.getElementById('toc').style.display = 'none'; return; }
    document.getElementById('toc').style.display = 'block';
    headings.forEach((heading, idx) => {
      const id = heading.id || ('toc-' + idx);
      heading.id = id;
      const a = document.createElement('a');
      a.href = '#' + id;
      a.className = 'toc-link ' + (heading.tagName === 'H3' ? 'toc-h3' : '');
      a.textContent = heading.textContent;
      a.setAttribute('data-target', id);
      a.addEventListener('click', (e) => {
        e.preventDefault();
        document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      const li = document.createElement('li');
      li.appendChild(a);
      tocList.appendChild(li);
    });
  },
  updateActive() {
    const headings = document.querySelectorAll('#main-content h2, #main-content h3');
    const scrollTop = window.scrollY;
    let activeId = null;
    headings.forEach(h => { if (h.offsetTop - 100 <= scrollTop) activeId = h.id; });
    document.querySelectorAll('.toc-link').forEach(link => {
      link.classList.toggle('active', link.getAttribute('data-target') === activeId);
    });
  }
};
