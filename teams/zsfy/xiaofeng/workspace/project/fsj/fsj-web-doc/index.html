:root {
  --bg-base: #ffffff;
  --bg-subtle: #fafbfc;
  --bg-sidebar: #f9fafb;
  --bg-card: #ffffff;
  --bg-hero: linear-gradient(135deg, #f0f9ff 0%, #faf5ff 50%, #fff7ed 100%);
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-tertiary: #94a3b8;
  --accent-primary: #6366f1;
  --accent-primary-light: #818cf8;
  --accent-cyan: #06b6d4;
  --accent-purple: #a855f7;
  --border-color: #e5e7eb;
  --border-hover: #d1d5db;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.05);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.05);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg-base);
  color: var(--text-primary);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

/* Topbar */
.topbar {
  position: sticky; top: 0; z-index: 100;
  height: 64px;
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center; padding: 0 32px;
}
.topbar-inner { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1400px; margin: 0 auto; }
.topbar-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text-primary); font-weight: 700; font-size: 1.0625rem; }
.topbar-logo .logo-text { display: flex; flex-direction: column; line-height: 1.2; }
.topbar-logo .logo-text small { font-size: 11px; color: var(--text-tertiary); font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
.topbar-nav { display: flex; align-items: center; gap: 8px; }
.topbar-nav a { padding: 8px 14px; border-radius: 8px; color: var(--text-secondary); font-size: 0.9375rem; font-weight: 500; transition: all 0.15s; text-decoration: none; }
.topbar-nav a:hover { background: var(--bg-subtle); color: var(--text-primary); }
.topbar-cta { margin-left: 8px; padding: 8px 16px; background: var(--accent-primary) !important; color: white !important; border-radius: 8px; font-weight: 600; font-size: 0.875rem; }
.topbar-cta:hover { background: var(--accent-primary-light) !important; transform: translateY(-1px); box-shadow: var(--shadow-md); }

/* Layout */
.layout {
  display: grid;
  grid-template-columns: 280px 1fr 240px;
  min-height: calc(100vh - 64px);
}
.main-wrapper {
  max-width: 880px;
  width: 100%;
  margin: 0 auto;
}

/* Sidebar */
.sidebar { border-right: 1px solid var(--border-color); padding: 32px 24px; position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto; }
.sidebar-title { font-size: 0.75rem; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; padding: 0 12px; }
.nav-link { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; color: var(--text-secondary); font-size: 0.9375rem; font-weight: 500; transition: all 0.15s; text-decoration: none; cursor: pointer; }
.nav-link:hover { background: var(--bg-subtle); color: var(--text-primary); }
.nav-link.active { background: rgba(99, 102, 241, 0.08); color: var(--accent-primary); }
.nav-link .nav-icon {
  width: 5px;
  height: 5px;
  background: currentColor;
  border-radius: 1px;
  opacity: 0.5;
  flex-shrink: 0;
  transform: rotate(45deg);
}

/* Main */
.main { padding: 48px 64px; min-width: 0; }
.hero { padding: 48px 0 32px; margin-bottom: 32px; border-bottom: 1px solid var(--border-color); }
.hero-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: rgba(99, 102, 241, 0.08); color: var(--accent-primary); border-radius: 999px; font-size: 0.8125rem; font-weight: 500; margin-bottom: 16px; }
.hero-title { font-size: 2.75rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; color: var(--text-primary); margin-bottom: 16px; }
.hero-subtitle { font-size: 1.125rem; color: var(--text-secondary); line-height: 1.6; max-width: 640px; }

h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 16px; color: var(--text-primary); }
h2 { font-size: 1.625rem; font-weight: 700; margin-top: 48px; margin-bottom: 16px; padding-top: 16px; border-top: 1px solid var(--border-color); color: var(--text-primary); letter-spacing: -0.01em; }
h2:first-of-type { border-top: none; margin-top: 32px; padding-top: 0; }
h3 { font-size: 1.25rem; font-weight: 600; margin-top: 32px; margin-bottom: 12px; color: var(--text-primary); }
h4 { font-size: 1.0625rem; font-weight: 600; margin-top: 24px; margin-bottom: 8px; color: var(--text-primary); }
p { margin-bottom: 16px; color: var(--text-secondary); font-size: 0.9375rem; }
a { color: var(--accent-primary); text-decoration: none; font-weight: 500; border-bottom: 1px solid transparent; transition: border-color 0.15s; }
a:hover { border-bottom-color: var(--accent-primary); }
ul, ol { margin-bottom: 16px; padding-left: 24px; color: var(--text-secondary); font-size: 0.9375rem; }
li { margin-bottom: 6px; line-height: 1.7; }
li::marker { color: var(--accent-primary); }
code { font-family: var(--font-mono); font-size: 0.875em; background: var(--bg-subtle); padding: 2px 6px; border-radius: 4px; color: var(--accent-primary); border: 1px solid var(--border-color); }
pre { background: #0f172a; border-radius: 12px; padding: 20px; overflow-x: auto; margin: 16px 0 24px; border: 1px solid #1e293b; box-shadow: var(--shadow-md); }
pre code { background: transparent; border: none; padding: 0; color: #e2e8f0; font-size: 0.875rem; line-height: 1.6; }
blockquote { border-left: 3px solid var(--accent-primary); padding: 12px 20px; margin: 24px 0; background: var(--bg-subtle); border-radius: 0 8px 8px 0; color: var(--text-secondary); font-style: italic; }
table { width: 100%; border-collapse: collapse; margin: 24px 0; font-size: 0.875rem; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
th { background: var(--bg-subtle); color: var(--text-primary); font-weight: 600; text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); color: var(--text-secondary); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg-subtle); }
strong { color: var(--text-primary); font-weight: 600; }
hr { border: none; border-top: 1px solid var(--border-color); margin: 32px 0; }
::selection { background: rgba(99, 102, 241, 0.2); color: var(--text-primary); }

/* Cards */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin: 24px 0; }
.card { display: block; padding: 20px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; transition: all 0.2s; text-decoration: none; color: var(--text-primary); }
.card:hover { border-color: var(--accent-primary); box-shadow: var(--shadow-md); transform: translateY(-2px); }

.card-title { font-size: 1rem; font-weight: 600; margin-bottom: 6px; color: var(--text-primary); font-family: var(--font-mono); }
.card-desc { font-size: 0.8125rem; color: var(--text-secondary); line-height: 1.5; }

/* TOC */
.toc { border-left: 1px solid var(--border-color); padding: 32px 24px; position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto; }
.toc-title { font-size: 0.75rem; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }
.toc-list { list-style: none; border-left: 1px solid var(--border-color); padding-left: 0; }
.toc-list li { margin: 0; padding: 0; }
.toc-link { display: block; padding: 6px 12px; color: var(--text-tertiary); border-left: 2px solid transparent; margin-left: -1px; font-size: 0.8125rem; transition: all 0.15s; text-decoration: none; cursor: pointer; }
.toc-link:hover { color: var(--text-primary); border-left-color: var(--border-hover); }
.toc-link.active { color: var(--accent-primary); border-left-color: var(--accent-primary); font-weight: 500; }
.toc-link.toc-h3 { padding-left: 24px; font-size: 0.75rem; }

.doc-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--bg-subtle); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 24px; }
.back-link { color: var(--text-secondary); font-size: 0.875rem; padding: 6px 12px; border-radius: 6px; transition: all 0.15s; text-decoration: none; }
.back-link:hover { background: var(--bg-base); color: var(--accent-primary); }
.doc-meta { font-size: 0.8125rem; color: var(--text-tertiary); }

@media (max-width: 1200px) {
  .layout { grid-template-columns: 240px 1fr; }
  .toc { display: none; }
}
@media (max-width: 768px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: relative; top: 0; height: auto; border-right: none; border-bottom: 1px solid var(--border-color); }
  .main { padding: 32px 24px; }
  .hero-title { font-size: 2rem; }
  h1 { font-size: 2rem; }
  h2 { font-size: 1.375rem; }
  .topbar { padding: 0 16px; }
  .topbar-nav a:not(.topbar-cta) { display: none; }
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

function WebviewPage(){
  const h = location.hash.slice(1);
  if (h.startsWith('webview/')) {
    const g = decodeURIComponent(h.slice(8));
    return renderWebviewGroup(g);
  }
  return renderWebviewIndex();
}
function renderWebviewIndex(){
  const names = Object.keys(WEBVIEW_B64);
  const cards = names.map(g => {
    const c = b64u(WEBVIEW_B64[g]);
    const n = (c.match(/<h2>/g)||[]).length;
    return '<a class="card" href="#webview/' + encodeURIComponent(g) + '"><div class="card-title">' + g + '</div><div class="card-desc">' + n + ' 个章节</div></a>';
  }).join('');
  return '<article><div class="hero"><div class="hero-badge"><span>●</span> 产品专题</div><h1 class="hero-title">webview2.0 深度</h1><p class="hero-subtitle">下一代小程序内嵌 H5 SPA 编辑器。三分离架构、Vite 驱动、Coze 流式响应、商家端完整指南。</p></div><h2>内容目录</h2><div class="card-grid">' + cards + '</div></article>';
}
function renderWebviewGroup(g){
  if (!WEBVIEW_B64[g]) return renderWebviewIndex();
  return '<article><div class="hero"><div class="hero-badge"><span>●</span> webview2.0</div><h1 class="hero-title">' + g + '</h1><p class="hero-subtitle">webview2.0 · ' + g + '</p></div><p><a href="#webview">← 返回目录</a></p>' + b64u(WEBVIEW_B64[g]) + '</article>';
}

function HapPage(){
  const h = location.hash.slice(1);
  if (h.startsWith('hap/')) {
    return renderBackendGroup(decodeURIComponent(h.slice(4)));
  }
  return renderBackendIndex();
}
function hapStats(){
  let t=0,f=0;
  Object.values(BACKEND_DATA).forEach(g=>Object.values(g).forEach(x=>{t++;f+=x.fields.length;}));
  return {t,f};
}
function renderBackendIndex(){
  const s = hapStats();
  const cards = Object.keys(BACKEND_DATA).map(g => {
    const tables = BACKEND_DATA[g];
    const c = Object.keys(tables).length;
    const f = Object.values(tables).reduce((a,x)=>a+x.fields.length,0);
    return '<a class="card" href="#hap/' + encodeURIComponent(g) + '"><div class="card-title">' + g + '</div><div class="card-desc">' + c + ' 张表 · ' + f + ' 个字段</div></a>';
  }).join('');
  return '<article>'
    + '<div class="hero"><div class="hero-badge"><span>●</span> 后端系统</div><h1 class="hero-title">孚世界后端数据字典</h1><p class="hero-subtitle">明道云 HAP 应用「孚世界」的数据字典。' + s.t + ' 张工作表 · ' + s.f + ' 个业务字段。只用 HAP 的数据表能力（DIY 方便），不用它的组织角色/角色权限/工作流。</p></div>'
    + '<h2>字典使用说明（Agent 必读）</h2>'
    + '<h3>一、我们的架构原则</h3>'
    + '<ul><li><strong>只用 HAP 的数据表</strong>：把 HAP 当灵活的 DIY 数据库，所有业务存在工作表里</li>'
    + '<li><strong>不用 HAP 的组织角色功能</strong>：HAP 自带的组织架构、角色权限体系<strong>没有使用</strong></li>'
    + '<li><strong>角色体系自己建</strong>：角色 = <code>用户</code> 表（成员）+ <code>组织角色</code> 表（角色定义），都是普通数据表</li>'
    + '<li><strong>不用 HAP 工作流审批</strong>：流程/审批类系统字段全部闲置</li></ul>'
    + '<h3>二、系统字段已隐藏</h3>'
    + '<p>每张表都有 15 个 HAP 自动添加的系统字段，<strong>本字典已全部隐藏</strong>，只保留业务字段：</p>'
    + '<table><thead><tr><th>系统字段别名</th><th>说明</th></tr></thead><tbody>'
    + '<tr><td>rowId</td><td>记录ID（系统自动，API 返回 _id）</td></tr>'
    + '<tr><td>_owner / _createdBy / _updatedBy</td><td>拥有者 / 创建人 / 修改人</td></tr>'
    + '<tr><td>_createdAt / _updatedAt</td><td>创建时间 / 修改时间</td></tr>'
    + '<tr><td>_processName / _nodeAssignees 等 9 个</td><td>HAP 工作流审批字段，全部未使用</td></tr>'
    + '</tbody></table>'
    + '<h3>三、给 Agent 的重要提醒</h3>'
    + '<blockquote>使用 hap-cli 或 HAP API 时，返回字段里<strong>会包含上述系统字段</strong>，命令行帮助也可能引导你用 HAP 的组织/角色/权限功能。<br><br>'
    + '<strong>请记住：</strong><br>'
    + '① 不要把系统字段当业务字段写入<br>'
    + '② 不要调 <code>hap app role</code>（HAP 角色权限）——我们的角色在 <code>用户</code> 和 <code>组织角色</code> 表里<br>'
    + '③ 不要用 <code>hap department</code>（HAP 组织架构）——我们的组织在 <code>组织</code>、<code>商家/组织</code> 表里<br>'
    + '④ 读写一律用 <code>hap worksheet record</code>，字段以本字典为准</blockquote>'
    + '<h3>四、字段标识怎么用</h3>'
    + '<ul><li><strong>别名（alias）</strong>：拼音缩写，API 调用最常用</li>'
    + '<li><strong>字段 ID</strong>：24 位十六进制，筛选/排序时用</li>'
    + '<li><strong>★</strong>：该表的标题字段</li></ul>'
    + '<h2>分组目录</h2><div class="card-grid">' + cards + '</div></article>';
}
function renderBackendGroup(gname){
  const group = BACKEND_DATA[gname];
  if (!group) return renderBackendIndex();
  let html = '<article><div class="hero"><div class="hero-badge"><span>●</span> ' + gname + '</div><h1 class="hero-title">' + gname + '</h1><p class="hero-subtitle">' + Object.keys(group).length + ' 张工作表 · ' + Object.values(group).reduce((a,x)=>a+x.fields.length,0) + ' 个字段</p></div><p><a href="#hap">← 返回全部分组</a></p>';
  if (gname === '内容元数据') {
    html += '<blockquote><strong>为什么叫「元」？</strong><br>① <strong>元 = 最小单元</strong>：所有信息性数据（商品、文章、评论、12维记忆、积分流水）都拆成最小元数据单元，统一存进一张表，靠 leixing + sew 区分类型。<br>② <strong>元 = 神经元</strong>：每个元数据像大脑神经元，通过 fu（父子）和 yynr（引用）互相连接织成网络——<strong>网的形态就是 Agent 的思维形态</strong>。</blockquote>';
  }
  for (const [tn, t] of Object.entries(group)) {
    html += '<h2>' + tn + '</h2><p>表 ID：<code>' + t.id + '</code> · ' + t.fields.length + ' 个字段</p>';
    html += '<table><thead><tr><th>字段名</th><th>别名</th><th>类型</th><th>字段 ID</th></tr></thead><tbody>';
    for (const f of t.fields) {
      html += '<tr><td>' + (f[4] ? '★ ' : '') + f[0] + '</td><td><code>' + f[1] + '</code></td><td>' + f[2] + '</td><td><code>' + f[3] + '</code></td></tr>';
    }
    html += '</tbody></table>';
  }
  return html + '</article>';
}

function CommunityPage(){
  const h = location.hash.slice(1);
  if (h === 'community' || h === 'community/overview') return COMMUNITY.overview;
  if (h === 'community/post') return COMMUNITY.post;
  if (h === 'community/悬赏' || h === 'community/bounty') return COMMUNITY["悬赏"];
  if (h === 'community/member') return COMMUNITY.member;
  if (h === 'community/interact') return COMMUNITY.interact;
  if (h === 'community/rank') return COMMUNITY.rank;
  if (h === 'community/space') return COMMUNITY.space;
  if (h === 'community/agent') return COMMUNITY.agent;
  if (h === 'community/ui') return COMMUNITY.ui;
  return COMMUNITY.overview;
}


// ===== 文档库 =====
function DocsPage(){
  const h = location.hash.slice(1);
  if (h.startsWith('docs/')) {
    return renderDocViewer(decodeURIComponent(h.slice(5)));
  }
  return renderDocList();
}
function renderDocList(){
  const names = Object.keys(MD_B64);
  const cards = names.map(n => '<a class="card" href="#docs/' + encodeURIComponent(n) + '"><div class="card-title">' + n + '.md</div><div class="card-desc">' + getMD(n).length + ' bytes</div></a>').join('');
  return '<article><div class="hero"><div class="hero-badge"><span>●</span> 文档库</div><h1 class="hero-title">所有 fsj 文档</h1><p class="hero-subtitle">点击查看。内容已内嵌到本 HTML，双击文件即可离线阅读。</p></div><h2>全部文档 (' + names.length + ')</h2><div class="card-grid">' + cards + '</div></article>';
}
function renderDocViewer(name){
  const c = getMD(name);
  if (!c) return renderDocList();
  return '<article><div class="doc-toolbar"><a class="back-link" href="#docs">← 返回文档列表</a><span class="doc-meta">' + name + '.md · ' + c.length + ' bytes</span></div>' + renderMarkdown(c) + '</article>';
}
function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function formatInline(t){
  let r = escapeHtml(t);
  r = r.replace(/`([^`]+)`/g,'<code>$1</code>');
  r = r.replace(/\*\*([^\*]+)\*\*/g,'<strong>$1</strong>');
  r = r.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  return r;
}
function renderMarkdown(md){
  const lines = md.split('\n');
  let html='', inCode=false, inList=false, code='', items=[], tbl=[];
  const flush = ()=>{ if(items.length){html+='<ul>'+items.join('')+'</ul>';items=[];} inList=false; };
  const flushTbl = ()=>{
    if(!tbl.length) return;
    const rows = tbl.filter(r => !/^\|?[\s:|-]+\|?$/.test(r));   // 去分隔行
    if(rows.length){
      const cells = r => r.replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>formatInline(c.trim()));
      html += '<table><thead><tr>' + cells(rows[0]).map(c=>'<th>'+c+'</th>').join('') + '</tr></thead>';
      if(rows.length>1){
        html += '<tbody>' + rows.slice(1).map(r=>'<tr>'+cells(r).map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('') + '</tbody>';
      }
      html += '</table>';
    }
    tbl=[];
  };
  for (let line of lines){
    if (line.startsWith('\u0060\u0060\u0060')){
      flushTbl(); flush();
      if (inCode){ html+='<pre><code>'+escapeHtml(code)+'</code></pre>'; code=''; inCode=false; }
      else { inCode=true; }
      continue;
    }
    if (inCode){ code+=line+'\n'; continue; }
    if (line.trim().startsWith('|')){ tbl.push(line.trim()); continue; }
    flushTbl();
    if (line.startsWith('#### ')){flush();html+='<h4>'+formatInline(line.slice(5))+'</h4>';continue;}
    if (line.startsWith('### ')){flush();html+='<h3>'+formatInline(line.slice(4))+'</h3>';continue;}
    if (line.startsWith('## ')){flush();html+='<h2>'+formatInline(line.slice(3))+'</h2>';continue;}
    if (line.startsWith('# ')){flush();html+='<h1>'+formatInline(line.slice(2))+'</h1>';continue;}
    if (/^\s*[-*]\s/.test(line)){inList=true;items.push('<li>'+formatInline(line.replace(/^\s*[-*]\s+/,''))+'</li>');continue;}
    if (/^\s*\d+\.\s/.test(line)){inList=true;items.push('<li>'+formatInline(line.replace(/^\s*\d+\.\s+/,''))+'</li>');continue;}
    if (line.startsWith('> ')){flush();html+='<blockquote>'+formatInline(line.slice(2))+'</blockquote>';continue;}
    if (line.trim()===''){flush();continue;}
    flush();html+='<p>'+formatInline(line)+'</p>';
  }
  flushTbl(); flush();
  if (inCode) html+='<pre><code>'+escapeHtml(code)+'</code></pre>';
  return html;
}

// ===== Router =====
const Router = {
  routes: {},
  init() {
    window.addEventListener('hashchange', () => this.handleRoute());
    this.handleRoute();
  },
  register(path, loader) { this.routes[path] = loader; },
  handleRoute() {
    const hash = window.location.hash.slice(1) || 'worldview';
    const [path] = hash.split('/');
    const loader = this.routes[path] || this.routes['worldview'];
    if (loader) {
      this.render(loader(), path);
      this.updateNav(path);
    }
  },
  render(html, path) {
    const main = document.getElementById('main-content');
    if (main) {
      main.innerHTML = html;
      window.scrollTo(0, 0);
      if (typeof TOC !== 'undefined' && TOC.build) setTimeout(() => TOC.build(), 0);
      window.dispatchEvent(new CustomEvent('content-loaded', { detail: { path } }));
    }
  },
  updateNav(activePath) {
    document.querySelectorAll('.nav-link').forEach(link => {
      link.classList.toggle('active', link.getAttribute('data-path') === activePath);
    });
  },
  navigate(path) { window.location.hash = '#' + path; }
};

// ===== TOC =====
const TOC = {
  init() {
    window.addEventListener('content-loaded', () => this.build());
    window.addEventListener('scroll', () => this.updateActive(), { passive: true });
  },
  build() {
    const main = document.getElementById('main-content');
    const tocList = document.getElementById('toc-list');
    if (!main || !tocList) return;
    const headings = main.querySelectorAll('h2, h3');
    tocList.innerHTML = '';
    if (headings.length === 0) { document.getElementById('toc').style.display = 'none'; return; }
    document.getElementById('toc').style.display = 'block';
    headings.forEach((heading, idx) => {
      const id = heading.id || ('toc-' + idx);
      heading.id = id;
      const a = document.createElement('a');
      a.href = '#' + id;
      a.className = 'toc-link ' + (heading.tagName === 'H3' ? 'toc-h3' : '');
      a.textContent = heading.textContent;
      a.setAttribute('data-target', id);
      a.addEventListener('click', (e) => {
        e.preventDefault();
        document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      const li = document.createElement('li');
      li.appendChild(a);
      tocList.appendChild(li);
    });
  },
  updateActive() {
    const headings = document.querySelectorAll('#main-content h2, #main-content h3');
    const scrollTop = window.scrollY;
    let activeId = null;
    headings.forEach(h => { if (h.offsetTop - 100 <= scrollTop) activeId = h.id; });
    document.querySelectorAll('.toc-link').forEach(link => {
      link.classList.toggle('active', link.getAttribute('data-target') === activeId);
    });
  }
};

// ===== inline: js/hap-client.js =====
// fsj-web-doc HAP 客户端（浏览器端）
// 通过 proxy.js（端口 3012）拉 HAP 数据，避免暴露 API key
// 创建：2026-08-17（小风）

const API_BASE = 'http://localhost:3012';

const HapClient = {
  async getDimensions() {
    try {
      const res = await fetch(API_BASE + '/api/dimensions');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (e) {
      console.error('[HapClient.getDimensions] 失败:', e);
      return [];
    }
  },

  async getDimension(id) {
    try {
      const res = await fetch(API_BASE + '/api/dimension/' + id);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (e) {
      console.error('[HapClient.getDimension] 失败:', e);
      return null;
    }
  }
};

// ===== inline: js/dimensions.js =====
// fsj-web-doc 12 维页面动态填充（build.py 构建时内联进 index.html）
// 机制：Router 渲染完 dimensions 路由后派发 content-loaded 事件，本钩子接管填充
// 创建：2026-08-17（小风）

window.addEventListener('content-loaded', async (e) => {
  const h = location.hash.slice(1);
  if (!h.startsWith('dimensions')) return;
  const main = document.getElementById('main-content');
  if (!main) return;

  if (h.startsWith('dimensions/')) {
    // 详情页
    const slug = decodeURIComponent(h.slice('dimensions/'.length));
    let d = await HapClient.getDimension(slug);
    if (!d) {
      // slug 可能是标题（如旧导航「寅 · 1维技能」），按名称兜底匹配
      const dims = await HapClient.getDimensions();
      d = dims.find(x => slug.includes(x.id + ' ') || x.name === slug || (x.diZhi + ' · ' + x.name) === slug) || null;
    }
    if (d) {
      main.innerHTML = `
        <article>
          <div class="hero">
            <div class="hero-badge"><span>●</span> ${d.layer}层 · ${d.wuxing}行</div>
            <h1 class="hero-title">${d.diZhi} · ${d.name}</h1>
            <p class="hero-subtitle">${d.usage}</p>
          </div>
          <blockquote><strong>性格（指导思考方式）：</strong>${d.character}</blockquote>
          <h2>字段速查</h2>
          <p><code>${d.fields}</code></p>
          <h2>典型例子</h2>
          <blockquote>${d.example}</blockquote>
          <h2>常见错误 / 反平铺</h2>
          <blockquote>${d.antipattern}</blockquote>
          <h2>与其他维度的关系</h2>
          <p>${d.relations}</p>
          <p><a href="#dimensions">← 返回 12 维列表</a></p>
        </article>`;
    } else {
      main.innerHTML = `
        <article>
          <div class="hero">
            <div class="hero-badge"><span>●</span> 记忆系统</div>
            <h1 class="hero-title">维度「${slug}」未找到</h1>
            <p class="hero-subtitle">请确认代理服务已启动，或该维度 id 正确。</p>
          </div>
          <p><a href="#dimensions">← 返回 12 维列表</a></p>
        </article>`;
    }
    if (typeof TOC !== 'undefined' && TOC.build) TOC.build();
    return;
  }

  // 列表页
  const el = document.getElementById('dim-list');
  if (!el) return;
  const dims = await HapClient.getDimensions();
  if (!dims.length) {
    el.innerHTML = '<div class="card"><div class="card-title">无法连接代理服务</div>' +
      '<div class="card-desc">12 维数据从 HAP 实时拉取。请先启动：<code>node server/proxy.js</code>（端口 3012），然后刷新本页。</div></div>';
    return;
  }
  el.innerHTML = dims.map(d =>
    '<a class="card" href="#dimensions/' + d.id + '">' +
    '<div class="card-title">' + d.diZhi + ' · ' + d.name + '</div>' +
    '<div class="card-desc">' + d.usage + '</div>' +
    '</a>'
  ).join('');
});

// ===== inline: js/doc-loader.js =====
// fsj-web-doc 文档页动态加载器（build.py 构建时内联进 index.html）
// 结构：数据库(页面) → 一级目录 → 二级目录(wznr=完整md，## 小标题在 md 里)
// 机制：Router 渲染静态兜底内容后派发 content-loaded；本钩子从 proxy 拉取 HAP 文档树，
//       成功则用 renderMarkdown 渲染替换正文，失败保持静态内容（双源：HAP 真身 + 内嵌快照兜底）
// 创建：2026-08-22（小风）

// 路由 → [一级目录名, 二级目录名]；二级名 null = 目录首页（列卡片）
const DOC_ROUTES = {
  overview:  ['架构', '总览'],
  worldview: ['架构', '世界观'],
  dao:       ['架构', '道天地将法'],
  data:      ['架构', '数据架构'],
  search:    ['架构', '检索机制'],
  integral:  ['架构', '积分系统'],
  team:      ['组织', 'Agent团队'],
  skills:    ['组织', '技能清单'],
  roadmap:   ['组织', '产品路线'],
  plan:      ['组织', '建设计划'],
  kb:        ['组织', '知识库归档'],
};
const COMMUNITY_ROUTES = {
  'community':           '总览',
  'community/overview':  '总览',
  'community/post':      '帖子系统',
  'community/悬赏':       '悬赏接单',
  'community/bounty':    '悬赏接单',
  'community/member':    '成员管理',
  'community/interact':  '互动系统',
  'community/rank':      '排行榜',
  'community/space':     '我的空间',
  'community/agent':     'Agent行为',
  'community/ui':        '商家配置',
};

function docRouteOf(hash) {
  const h = decodeURIComponent(hash);
  if (DOC_ROUTES[h]) return DOC_ROUTES[h];
  if (COMMUNITY_ROUTES[h]) return ['社区', COMMUNITY_ROUTES[h]];
  if (h === 'webview') return ['webview2.0', null, 'webview'];
  if (h.startsWith('webview/')) return ['webview2.0', decodeURIComponent(h.slice(8)), 'webview'];
  if (h === 'mech') return ['检索机制', null, 'mech'];
  if (h.startsWith('mech/')) return ['检索机制', decodeURIComponent(h.slice(5)), 'mech'];
  return null;
}

function renderDocLeaf(cat, leaf) {
  return '<article>'
    + '<div class="hero"><div class="hero-badge"><span>●</span> ' + cat + '</div>'
    + '<h1 class="hero-title">' + leaf.name + '</h1></div>'
    + renderMarkdown(leaf.wznr || '')
    + '</article>';
}

function renderDocIndex(cat, tree, base) {
  const prefix = base || 'webview';
  const cards = tree.leaves.map(l =>
    '<a class="card" href="#' + prefix + '/' + encodeURIComponent(l.name) + '">'
    + '<div class="card-title">' + l.name + '</div>'
    + '<div class="card-desc">' + ((l.wznr || '').length) + ' 字</div></a>'
  ).join('');
  return '<article>'
    + '<div class="hero"><div class="hero-badge"><span>●</span> ' + (tree.name || cat) + '</div>'
    + '<h1 class="hero-title">' + cat + '</h1>'
    + '<p class="hero-subtitle">' + (tree.overview || '') + '</p></div>'
    + '<h2>内容目录</h2><div class="card-grid">' + cards + '</div></article>';
}

window.addEventListener('content-loaded', async () => {
  const target = docRouteOf(location.hash.slice(1));
  if (!target) return;
  const [cat, leafName, base] = target;
  const main = document.getElementById('main-content');
  if (!main) return;
  try {
    const res = await fetch(API_BASE + '/api/doctree/' + encodeURIComponent(cat));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const tree = await res.json();
    if (!tree.leaves || !tree.leaves.length) return;
    if (leafName === null) {
      main.innerHTML = renderDocIndex(cat, tree, base);
    } else {
      const leaf = tree.leaves.find(l => l.name === leafName)
        || (leafName === '总览' && cat === 'webview2.0' ? tree.leaves[0] : null);
      if (!leaf) return;
      main.innerHTML = renderDocLeaf(cat, leaf);
    }
    if (typeof TOC !== 'undefined' && TOC.build) TOC.build();
  } catch (err) {
    console.warn('[doc-loader] HAP 拉取失败，保持静态兜底内容:', err);
  }
});
